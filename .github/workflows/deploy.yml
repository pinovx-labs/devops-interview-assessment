name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci # better for production

      - name: Run tests
        run: npm test

      - name: Deploy to Railway
        run: railway up --service backend
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
