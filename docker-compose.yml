version: "3.9"

services:
  app:
    build: .
    ports:
      - "3001:3000"

    environment:
      - DATABASE_URL=postgres://pinovx:pinovx_pass@db:5432/pinovx_db
      - PORT=3000

    depends_on:
      - db

    networks:
      - pinovx-net

  db:
    image: postgres:15

    environment:
      - POSTGRES_USER=pinovx
      - POSTGRES_PASSWORD=different_pass
      - POSTGRES_DB=pinovx_db

    ports:
      - "5432:5432"

    networks:
      - pinovx-net

networks:
  pinovx-net: